name: Cloud Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mobile Tools & Engine
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          echo '<script>window.location.href="https://cycle-self-insights.lovable.app/";</script>' > www/index.html

      - name: Configure App Container
        run: |
          npx cap init CycleInsights com.sianmurison.cycleinsights --web-dir=www
          npx cap add android

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Standalone APK Binary
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK File
        uses: actions/upload-artifact@v4
        with:
          name: CycleInsights-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

